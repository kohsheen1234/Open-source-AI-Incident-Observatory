<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 860" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a4a4a"/>
    </marker>
    <style>
      .bg   { fill:#0b0d0d; }
      .band { fill:#0e1212; stroke:#1c2222; stroke-width:1; rx:16; }
      .box  { fill:#131717; stroke:#242b2b; stroke-width:1.2; }
      .teal { stroke:#18b2ba; }
      .t    { fill:#e9eceb; font-size:15px; font-weight:500; }
      .s    { fill:#8fa0a0; font-size:11.5px; }
      .m    { fill:#18b2ba; font-size:10.5px; letter-spacing:1.5px; font-family:ui-monospace,monospace; }
      .mm   { fill:#7c8a8a; font-size:10px; font-family:ui-monospace,monospace; }
      .ln   { stroke:#3a4a4a; stroke-width:1.4; fill:none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="860" rx="18"/>

  <!-- ============ SOURCES ============ -->
  <text class="m" x="40" y="46">01 · SOURCES</text>
  <g>
    <rect class="box" x="40"  y="60" width="285" height="62" rx="12"/>
    <text class="t" x="58" y="88">Hacker News</text>
    <text class="s" x="58" y="107">Algolia search API · live</text>

    <rect class="box" x="378" y="60" width="284" height="62" rx="12"/>
    <text class="t" x="396" y="88">Reddit</text>
    <text class="s" x="396" y="107">PRAW · opt-in</text>

    <rect class="box" x="715" y="60" width="285" height="62" rx="12"/>
    <text class="t" x="733" y="88">Replay</text>
    <text class="s" x="733" y="107">bundled fixtures · no keys</text>
  </g>
  <path class="ln" d="M182 122 L182 152" marker-end="url(#arrow)"/>
  <path class="ln" d="M520 122 L520 152" marker-end="url(#arrow)"/>
  <path class="ln" d="M857 122 L857 152" marker-end="url(#arrow)"/>

  <!-- ============ INGESTION ============ -->
  <rect class="band" x="40" y="152" width="960" height="126" rx="16"/>
  <text class="m" x="58" y="178">02 · INGESTION PIPELINE</text>
  <text class="mm" x="905" y="178">cli · scheduler</text>

  <rect class="box" x="58"  y="194" width="286" height="66" rx="12"/>
  <text class="t" x="76" y="222">Collect</text>
  <text class="s" x="76" y="241">DataSource → RawArtifact</text>

  <rect class="box teal" x="374" y="194" width="286" height="66" rx="12"/>
  <text class="t" x="392" y="222">Preserve</text>
  <text class="s" x="392" y="241">SHA-256 hash · hash author</text>

  <rect class="box" x="690" y="194" width="292" height="66" rx="12"/>
  <text class="t" x="708" y="222">Normalise + de-dup</text>
  <text class="s" x="708" y="241">dedupe on content hash</text>

  <path class="ln" d="M344 227 L374 227" marker-end="url(#arrow)"/>
  <path class="ln" d="M660 227 L690 227" marker-end="url(#arrow)"/>

  <path class="ln" d="M520 278 L520 320" marker-end="url(#arrow)"/>

  <!-- ============ STORAGE ============ -->
  <text class="m" x="40" y="344">03 · STORAGE</text>
  <rect class="box teal" x="360" y="356" width="320" height="66" rx="12"/>
  <text class="t" x="378" y="384">PostgreSQL</text>
  <text class="s" x="378" y="403">raw_artifacts · incidents · classifications · reviews</text>

  <rect class="box" x="715" y="356" width="285" height="66" rx="12"/>
  <text class="t" x="733" y="384">Artifact store</text>
  <text class="s" x="733" y="403">&lt;source&gt;/&lt;yyyy&gt;/&lt;mm&gt;/&lt;hash&gt;.json</text>
  <path class="ln" d="M680 389 L715 389" marker-end="url(#arrow)"/>

  <!-- ============ CLASSIFY + EVAL ============ -->
  <text class="m" x="40" y="470">04 · CLASSIFY &amp; EVALUATE</text>

  <rect class="box" x="40" y="482" width="470" height="96" rx="12"/>
  <text class="t" x="58" y="510">Classifier</text>
  <text class="s" x="58" y="529">versioned prompt · structured JSON · retry → abstain</text>
  <rect x="58" y="542" width="360" height="24" rx="6" fill="#0f1414" stroke="#242b2b"/>
  <text class="mm" x="70" y="558">providers: baseline · ollama · anthropic</text>

  <rect class="box" x="530" y="482" width="470" height="96" rx="12"/>
  <text class="t" x="548" y="510">Evaluation</text>
  <text class="s" x="548" y="529">labelled set · precision / recall / macro-F1</text>
  <text class="s" x="548" y="548">confusion matrix · abstention · CI regression gate</text>

  <!-- Postgres <-> classify -->
  <path class="ln" d="M430 422 C 300 445, 260 455, 250 482" marker-end="url(#arrow)"/>
  <path class="ln" d="M610 422 C 700 445, 730 455, 740 482" marker-end="url(#arrow)"/>

  <path class="ln" d="M520 578 L520 620" marker-end="url(#arrow)"/>

  <!-- ============ ACCESS ============ -->
  <rect class="band" x="40" y="620" width="960" height="200" rx="16"/>
  <text class="m" x="58" y="646">05 · ACCESS LAYER</text>

  <rect class="box teal" x="360" y="660" width="320" height="70" rx="12"/>
  <text class="t" x="378" y="688">FastAPI</text>
  <text class="s" x="378" y="707">REST · OpenAPI · API-key · CORS</text>

  <!-- React SPA -->
  <rect class="box" x="58" y="660" width="250" height="70" rx="12"/>
  <text class="t" x="76" y="688">React SPA</text>
  <text class="s" x="76" y="707">Vite · static site (always-on)</text>
  <path class="ln" d="M360 695 L308 695" marker-end="url(#arrow)"/>

  <!-- Prometheus + Grafana -->
  <rect class="box" x="732" y="660" width="250" height="70" rx="12"/>
  <text class="t" x="750" y="688">Prometheus → Grafana</text>
  <text class="s" x="750" y="707">/metrics · dashboards</text>
  <path class="ln" d="M680 695 L732 695" marker-end="url(#arrow)"/>

  <!-- review write-back -->
  <rect class="box" x="360" y="748" width="320" height="52" rx="12"/>
  <text class="t" x="378" y="770">Human review</text>
  <text class="s" x="378" y="788">accept · override · false-positive → API</text>
  <path class="ln" d="M520 748 L520 730" marker-end="url(#arrow)"/>

  <!-- API reads from Postgres -->
  <path class="ln" d="M520 422 L520 660" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
</svg>
